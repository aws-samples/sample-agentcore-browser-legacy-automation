# nginx/nginx.conf — envsubst template
#
# Single-profile gateway: the reference architecture ships one AgentCore
# runtime (browser). The ?profile= query-param and $arg_profile maps are
# retained because AgentCore's edge still uses SNI-based routing — the map
# tables give us a single place to wire additional profiles back in later
# without touching the location blocks.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Secure log format — excludes tokens from logs
    log_format ws_secure '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'upstream=$upstream_addr';

    # Rate limiting: 10 req/s per IP, burst 20
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;

    sendfile on;
    keepalive_timeout 65;

    # Profile-based upstream routing (single-profile: browser is the default)
    map $arg_profile $backend_upstream {
        default          browser_worker;
        "browser"        browser_worker;
    }

    # Profile-based ARN resolution
    map $arg_profile $backend_arn {
        default          ${BROWSER_AGENT_ARN};
        "browser"        ${BROWSER_AGENT_ARN};
    }

    # Profile-based upstream hostname (for SNI + Host header).
    # Required because AgentCore's TLS edge uses SNI-based routing: without
    # proxy_ssl_server_name on + proxy_ssl_name set to the real hostname,
    # NGINX sends SNI="<upstream-name>" (e.g. "browser_worker") which the
    # AgentCore edge rejects, surfacing as 503 on the client side.
    map $arg_profile $backend_host {
        default          ${BROWSER_AGENTCORE_ENDPOINT};
        "browser"        ${BROWSER_AGENTCORE_ENDPOINT};
    }

    upstream browser_worker {
        server ${BROWSER_AGENTCORE_ENDPOINT}:443;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/access.log ws_secure;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Health check
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status": "ok"}';
        }

        # WebSocket proxy
        location /ws {
            limit_req zone=ws_limit burst=20 nodelay;

            # Extract JWT from query parameter
            set $jwt_token $arg_token;
            if ($jwt_token = "") {
                return 401 '{"error": "Missing token"}';
            }

            # Proxy to AgentCore upstream
            proxy_pass https://$backend_upstream/runtimes/$backend_arn/ws;
            proxy_http_version 1.1;

            # TLS SNI — AgentCore's edge is multi-tenant and uses SNI to
            # select the correct certificate + routing. Without these two
            # directives NGINX sends no SNI (or the upstream name as SNI),
            # the TLS handshake either fails silently or hits a 503 wall.
            proxy_ssl_server_name on;
            proxy_ssl_name $backend_host;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Auth and routing headers
            proxy_set_header Authorization "Bearer $jwt_token";
            proxy_set_header X-Profile-Id $arg_profile;
            # Host header must match the real AgentCore hostname so the edge
            # virtual-host routing picks the right runtime. Sending the ALB /
            # CloudFront host (via $host) would make AgentCore return 503.
            proxy_set_header Host $backend_host;

            # Timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;

            # Disable buffering for WebSocket
            proxy_buffering off;
        }

        # API proxy (future use)
        location /api/ {
            limit_req zone=ws_limit burst=20 nodelay;

            set $jwt_token $arg_token;
            if ($jwt_token = "") {
                return 401 '{"error": "Missing token"}';
            }

            proxy_pass https://$backend_upstream/runtimes/$backend_arn/;
            proxy_http_version 1.1;

            # Same TLS SNI + Host fix as /ws — see comment in /ws block.
            proxy_ssl_server_name on;
            proxy_ssl_name $backend_host;

            proxy_set_header Authorization "Bearer $jwt_token";
            proxy_set_header X-Profile-Id $arg_profile;
            proxy_set_header Host $backend_host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }

        # Default 404
        location / {
            default_type application/json;
            return 404 '{"error": "Not found"}';
        }
    }
}
