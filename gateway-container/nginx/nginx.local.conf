# nginx/nginx.local.conf — local-only config (NOT an envsubst template).
#
# Purpose: run the gateway locally against a local browser-agent-container
# Starlette server (http://host.docker.internal:8081/ws) while still exercising
# the full NGINX profile routing / JWT-injection / WebSocket upgrade path.
#
# Differences vs. nginx.conf (production):
#   - No envsubst — all values inlined for local use
#   - Routes to host.docker.internal:8081 over plain HTTP (no TLS, no ARN)
#   - Rate limit relaxed (100 r/s) to avoid blocking rapid dev iteration
#
# Usage (from project root):
#   docker run --rm --name gateway-local \
#     -p 8080:80 \
#     -v "$(pwd)/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro" \
#     --add-host=host.docker.internal:host-gateway \
#     nginx:stable-alpine
#
# Or via the VS Code task `gateway:docker:run-local`.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format ws_secure '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'upstream=$upstream_addr profile=$arg_profile';

    # Relaxed rate limit for local dev (prod: 10 r/s)
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=100r/s;

    # WebSocket upgrade plumbing
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile on;
    keepalive_timeout 65;

    # host.docker.internal resolves to the Docker host from inside the container
    # (macOS / Windows / Docker Desktop on Linux via --add-host=host-gateway).
    # The local browser-agent-container Starlette server listens on port 8081.
    upstream browser_local {
        server host.docker.internal:8081;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/access.log ws_secure;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Health check
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status": "ok", "mode": "local"}';
        }

        # WebSocket proxy — single-profile (browser). Missing or unknown
        # ?profile= values are ignored and routed to the browser upstream.
        location = /ws {
            limit_req zone=ws_limit burst=50 nodelay;

            set $jwt_token $arg_token;
            if ($jwt_token = "") {
                return 401 '{"error": "Missing token"}';
            }

            # Browser profile → local Starlette server (plain HTTP, no ARN path).
            # Strip query args from proxy_pass so nginx forwards the original
            # client query string intact (so ?profile=browser&token=... reaches
            # the upstream exactly as the client sent it).
            proxy_pass http://browser_local/ws;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Mirror production auth injection — browser-agent doesn't verify the
            # JWT locally, but we still inject it so logs / handlers look realistic.
            proxy_set_header Authorization "Bearer $jwt_token";
            proxy_set_header X-Profile-Id "browser";
            proxy_set_header Host $host;

            # Long-lived WebSocket timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;

            proxy_buffering off;
        }

        location / {
            default_type application/json;
            return 404 '{"error": "Not found"}';
        }
    }
}
