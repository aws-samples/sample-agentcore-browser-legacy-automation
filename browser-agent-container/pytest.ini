[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --log-cli-level=DEBUG
    --log-cli-format="[%(levelname)s] [%(name)s] %(message)s"
    --log-cli-date-format="%H:%M:%S"

log_cli = true
log_auto_indent = true

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
