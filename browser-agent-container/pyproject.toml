[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-agent-container"
version = "0.14.0"
description = "Browser Agent Container - Strands-based browser automation agent via AgentCore Browser Tool"
authors = [
    {name = "ProServe Canada", email = "proserve@amazon.com"}
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "strands-agents==1.30.0",
    "strands-agents-tools==0.2.22",
    "bedrock-agentcore==1.4.7",
    "playwright==1.58.0",
    "nest-asyncio==1.6.0",
    "pydantic==2.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.0",
    "pylint>=2.17.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.txt"]
